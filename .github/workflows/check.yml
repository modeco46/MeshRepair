name: Check and build Windows app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux graphics runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libopengl0 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 xvfb
      - run: >-
          python -m pip install --only-binary=:all: -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Check embedded OpenGL viewport
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/check_viewport.py
      - run: python tests/benchmark_synthetic.py
  windows:
    defaults:
      run:
        shell: cmd
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.16.0
      - name: Build portable folder
        run: python -m PyInstaller --noconfirm --clean --onedir --console --name MeshRepair --collect-all meshlib --collect-submodules scipy.sparse.csgraph --copy-metadata scipy --hidden-import meshrepair.worker --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor --add-data "meshrepair/assets;meshrepair/assets" --copy-metadata meshlib --copy-metadata meshlib-core --copy-metadata PySide6-Essentials --copy-metadata shiboken6 --copy-metadata vtk --copy-metadata numpy launch.py
      - name: Check packaged native worker
        run: python tests/check_bundle.py dist/MeshRepair/MeshRepair.exe
      - name: Include instructions and license notices
        shell: cmd
        run: |
          copy README.md dist\MeshRepair\README.md
          copy THIRD_PARTY.md dist\MeshRepair\THIRD_PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: MeshRepair-0.8.0-windows-x64
          path: dist/MeshRepair/
          retention-days: 30
